# What the agent factory needs to know about this repo. Fill it in, then commit it.
# A gate is one argv list, run in the task's worktree and judged by its exit code: 0 passes, 75 means the
# environment is broken (the task blocks as `infra`), anything else fails. Print a summary of the failure
# (at most 50 lines) on stdout: that is all the coder gets back. Call the same commands from the repo's CI.
#
# Commands run in the task's worktree: after_create once it exists, and
# after_merge in the main checkout after a merge that changed a lockfile.
#
# The factory makes some worktrees itself, not with agent-worktree: a wave's review worktree and the worktree of
# gates.prove. Nothing copies packages into them: they get them only from after_create, so install them there.
hooks:
  after_create: []
  # after_create:
  #   - [bun, install, --frozen-lockfile]   # or [npm, ci], [uv, sync, --frozen]
  after_merge: []
# Every gate command takes one of the machine's test slots (FACTORY_SLOTS, default cores / 4) and gets
# FACTORY_TEST_JOBS = cores / slots as its parallelism; hooks take none. Run tests by hand with `factory slot -- <cmd>`.
# Fast checks (lint, types, format) after every coder turn.
gates: []
# Everything, tests included: run in the merge queue on the rebased branch,
# before the fast-forward. A wave runs them once on its rebased branch before
# its reviewer, and at its merge only when the target moved since.
merge_gates: []
# A wave's task, in the merge queue into the wave's branch, after gates (not
# merge_gates): the tests its change reaches. Env FACTORY_BASE is the commit
# the rebased change sits on (diff FACTORY_BASE..HEAD). Unset: gates only.
task_gates: []
