[project]
name = "factory-tui"
version = "0.1.0"
description = "A read-only terminal view of the agent factory: repositories, waves and tasks through the factory CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
]

[project.scripts]
factory-tui = "factory_tui.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
