# What the agent factory needs to know about this repo (it builds itself with the installed version).
# Task worktrees come from `agent-worktree`, which copies node_modules: nothing to install.
hooks:
  # A worktree the factory adds itself (a merge request) has no node_modules.
  after_create:
    - [bun, install, --frozen-lockfile]
  after_code: []
  after_merge:
    - [bun, install, --frozen-lockfile]
# After every coder turn: types only.
gates:
  - [bun, run, types]
# When a wave's task merges into the wave's branch: the tests its change reaches.
task_gates:
  - [bun, scripts/changed-tests.ts]
# Once per wave before its review, and at the merge of a task outside a wave: types and the whole suite.
merge_gates:
  - [bun, run, types]
  - [bun, run, test]
  # The TUI's own tests, once it exists.
  - [bash, -c, "test ! -d tui || (cd tui && uv run --quiet pytest -q)"]
